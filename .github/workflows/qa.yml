name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js and pnpm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, type-check and test
        run: pnpm run qa
      - name: Build
        run: pnpm run build
      - name: Check the JSR package
        run: npx jsr@0.14.3 publish --dry-run
      - name: Coverage
        run: pnpm run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: test (node ${{ matrix.node-version }}, express ${{ matrix.express }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        express: [4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Express ${{ matrix.express }}
        if: matrix.express != 5
        run: pnpm add --save-dev express@${{ matrix.express }} @types/express@${{ matrix.express }}
      - run: pnpm test
