name: publish
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges the GitHub OIDC token for a
      # short-lived publish token, so no NPM_TOKEN is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js, pnpm and npm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile
      # `prepack` runs QA and the build. Staged: the version stays unpublished
      # until a maintainer approves it on npmjs.com or with
      # `npm stage approve <stage-id>`.
      - name: Stage on npm
        run: npm stage publish
